name: OneDrive to Google Drive Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

jobs:
  cloud_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Restore Rclone Config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Sync one1 to Google Drive
        run: |
          rclone copy one1:/ gdrive:/ -v --stats 15s --fast-list \
            --exclude "Personal Vault/**" \
            --drive-chunk-size 16M \
            --buffer-size 64M \
            --onedrive-no-versions \
            --timeout 3m \
            --contimeout 30s \
            --transfers 2 \
            --checkers 8

      - name: Sync one2 to Google Drive
        run: |
          rclone copy one2:/ gdrive:/ -v --stats 15s --fast-list --ignore-existing \
            --exclude "Personal Vault/**" \
            --drive-chunk-size 16M \
            --buffer-size 64M \
            --onedrive-no-versions \
            --timeout 3m \
            --contimeout 30s \
            --transfers 2 \
            --checkers 8
